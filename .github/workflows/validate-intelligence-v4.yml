name: Validate Intelligence clarity patch

on:
  push:
    branches:
      - agent/intelligence-v4-clarity

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/intelligence-v3.js
      - name: Check required UI hooks
        run: |
          grep -q 'id="quick-title"' intelligence-v3.html
          grep -q 'id="analysis-window"' intelligence-v3.html
          grep -q 'id="quick-weather"' intelligence-v3.html
          grep -q 'id="place-horizon"' intelligence-v3.html
          grep -q 'runAnalysisFromInput' assets/intelligence-v3.js
