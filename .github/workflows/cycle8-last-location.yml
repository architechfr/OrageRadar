name: Cycle 8 - restore last location

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle8-last-location.yml'

permissions:
  contents: write

jobs:
  apply-cycle-8:
    if: github.event.head_commit.message == 'chore: apply cycle 8 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch OrageRadar
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          anchor = '''    let currentZoom = DEFAULT_ZOOM;\n    let currentMode = "radar";\n'''
          replacement = '''    let currentZoom = DEFAULT_ZOOM;\n    let currentMode = "radar";\n\n    const LAST_LOCATION_KEY = "lastLocation";\n\n    function saveLastLocation(lat, lon, cityName, country, zoom) {\n        if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lon)) || !cityName) return;\n        localStorage.setItem(LAST_LOCATION_KEY, JSON.stringify({\n            lat: Number(lat),\n            lon: Number(lon),\n            name: cityName,\n            country: country || "",\n            zoom: Number.isFinite(Number(zoom)) ? Number(zoom) : SELECTED_CITY_ZOOM\n        }));\n    }\n\n    function getLastLocation() {\n        try {\n            const saved = JSON.parse(localStorage.getItem(LAST_LOCATION_KEY) || "null");\n            if (!saved || !saved.name || !Number.isFinite(Number(saved.lat)) || !Number.isFinite(Number(saved.lon))) {\n                return null;\n            }\n            return {\n                lat: Number(saved.lat),\n                lon: Number(saved.lon),\n                name: saved.name,\n                country: saved.country || "",\n                zoom: Number.isFinite(Number(saved.zoom)) ? Number(saved.zoom) : SELECTED_CITY_ZOOM\n            };\n        } catch (e) {\n            localStorage.removeItem(LAST_LOCATION_KEY);\n            return null;\n        }\n    }\n'''
          if anchor not in text:
              raise SystemExit('Anchor currentMode not found')
          text = text.replace(anchor, replacement, 1)

          anchor = '''        currentCountry = country;\n        currentZoom = zoom;\n\n        refreshMap();\n'''
          replacement = '''        currentCountry = country;\n        currentZoom = zoom;\n        saveLastLocation(lat, lon, cityName, country, zoom);\n\n        refreshMap();\n'''
          if anchor not in text:
              raise SystemExit('Anchor setLocation not found')
          text = text.replace(anchor, replacement, 1)

          anchor = '''        renderFavorites();\n\n        await setLocation(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name, DEFAULT_LOCATION.country, {\n            save: false,\n            zoom: DEFAULT_ZOOM,\n            showCountry: true\n        });\n'''
          replacement = '''        renderFavorites();\n\n        const savedLocation = getLastLocation();\n        const startLocation = savedLocation || { ...DEFAULT_LOCATION, zoom: DEFAULT_ZOOM };\n\n        await setLocation(startLocation.lat, startLocation.lon, startLocation.name, startLocation.country || "", {\n            save: false,\n            zoom: startLocation.zoom,\n            showCountry: true\n        });\n'''
          if anchor not in text:
              raise SystemExit('Anchor init not found')
          text = text.replace(anchor, replacement, 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if 'orageradar-v10' not in sw_text:
              raise SystemExit('Expected service worker cache v10 not found')
          sw.write_text(sw_text.replace('orageradar-v10', 'orageradar-v11', 1), encoding='utf-8')

          state = Path('docs/STATE.md')
          state_text = state.read_text(encoding='utf-8')
          cycle = '''# OrageRadar — état du projet\n\n_Dernière mise à jour : 16 août 2026 (soir, cycle 8)_\n\n## Dernier cycle — restauration du dernier lieu consulté\n\n**Objectif** : ne plus revenir systématiquement sur Paris au démarrage.\n\n**Implémentation** : chaque appel à `setLocation()` mémorise le lieu courant (`lat`, `lon`, nom, pays, zoom) dans `localStorage.lastLocation`. Au lancement, `init()` restaure ce lieu s'il est valide ; sinon l'application revient proprement sur Paris. Les données invalides ou corrompues sont ignorées.\n\n**Impact** : une ville choisie via recherche, favori ou « Ma position » devient le lieu de reprise au prochain lancement. L'historique de recherche reste indépendant.\n\n**Cache PWA** : `orageradar-v10` → `orageradar-v11`.\n\n**Vérification** : syntaxe JavaScript extraite de `index.html` vérifiée par Node.js dans GitHub Actions.\n\n## Historique précédent\n'''
          old_header = '# OrageRadar — état du projet\n\n_Dernière mise à jour : 16 août 2026 (soir, cycle 7)_\n'
          if old_header not in state_text:
              raise SystemExit('STATE header not found')
          state_text = state_text.replace(old_header, cycle, 1)
          state.write_text(state_text, encoding='utf-8')

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          Path('/tmp/orageradar-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/orageradar-inline.js

      - name: Commit cycle 8
        shell: bash
        run: |
          git config user.name "OrageRadar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js docs/STATE.md
          git diff --cached --check
          git commit -m "feat: restore last viewed location"
          git push origin main
