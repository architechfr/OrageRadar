name: Apply 7-day forecast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-7-day-forecast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/7-day-forecast
          fetch-depth: 0

      - name: Patch 7-day forecast
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          anchor = '''    <div id="models-card" class="hidden bg-slate-900 border border-slate-700 rounded-3xl p-6 mb-8">'''
          card = '''    <div id="daily-card" class="hidden bg-slate-900 border border-slate-700 rounded-3xl p-6 mb-8">\n        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-5">\n            <h3 class="font-semibold flex items-center gap-x-2">\n                <i class="fa-solid fa-calendar-days text-sky-400"></i>\n                Prévisions 7 jours\n            </h3>\n            <span class="text-xs text-slate-500">Températures · pluie · risque orageux</span>\n        </div>\n        <div id="daily-chart" class="relative h-32 mb-5"></div>\n        <div id="daily-forecast" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-3"></div>\n    </div>\n\n'''
          if anchor not in s: raise SystemExit('models card anchor not found')
          s = s.replace(anchor, card + anchor, 1)

          old = '''            "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_gusts_10m,cape,wind_direction_700hPa" +\n            "&timezone=auto";'''
          new = '''            "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_gusts_10m,cape,wind_direction_700hPa" +\n            "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max" +\n            "&forecast_days=7" +\n            "&timezone=auto";'''
          if old not in s: raise SystemExit('weather url anchor not found')
          s = s.replace(old, new, 1)

          old = '''            renderStormAlert(current, data);\n            renderNowcast(current, data);\n            renderHourlyForecast(data);\n'''
          new = '''            renderStormAlert(current, data);\n            renderNowcast(current, data);\n            renderHourlyForecast(data);\n            renderDailyForecast(data);\n'''
          if old not in s: raise SystemExit('render calls anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''    async function showSuggestions() {'''
          fn = '''    function renderDailyForecast(data) {\n        const card = document.getElementById("daily-card");\n        const container = document.getElementById("daily-forecast");\n        const chart = document.getElementById("daily-chart");\n        const D = data.daily;\n        if (!D || !D.time || !D.time.length) { card.classList.add("hidden"); return; }\n\n        const count = Math.min(7, D.time.length);\n        const days = Array.from({ length: count }, (_, i) => ({\n            date: new Date(D.time[i] + "T12:00:00"),\n            code: D.weather_code[i],\n            max: D.temperature_2m_max[i],\n            min: D.temperature_2m_min[i],\n            rain: D.precipitation_sum ? (D.precipitation_sum[i] || 0) : 0,\n            prob: D.precipitation_probability_max ? (D.precipitation_probability_max[i] || 0) : 0\n        }));\n\n        container.innerHTML = "";\n        days.forEach((d, i) => {\n            const info = getWeatherInfo(d.code);\n            const storm = stormLevel(d.code) >= 2;\n            const wet = d.prob >= 50 || d.rain >= 1;\n            const div = document.createElement("div");\n            div.className = "bg-slate-800/70 border border-slate-700 rounded-2xl p-3 text-center";\n            const dayLabel = i === 0 ? "Aujourd'hui" : d.date.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "");\n            const risk = storm\n                ? '<span class="text-violet-300"><i class="fa-solid fa-bolt"></i> Orage</span>'\n                : wet ? `<span class="text-sky-300"><i class="fa-solid fa-droplet"></i> ${Math.round(d.prob)}%</span>`\n                : '<span class="text-emerald-300">Sec</span>';\n            div.innerHTML = `\n                <div class="text-xs text-slate-400 capitalize">${dayLabel}</div>\n                <div class="text-3xl my-2">${info.emoji}</div>\n                <div class="font-semibold">${Math.round(d.max)}° <span class="text-slate-500 font-normal">/ ${Math.round(d.min)}°</span></div>\n                <div class="text-xs mt-2">${risk}</div>\n                <div class="text-[11px] text-slate-500 mt-1">${d.rain.toFixed(1)} mm</div>`;\n            container.appendChild(div);\n        });\n\n        const values = days.flatMap(d => [d.max, d.min]).filter(Number.isFinite);\n        const lo = Math.min(...values) - 2, hi = Math.max(...values) + 2, span = Math.max(1, hi - lo);\n        const width = 700, height = 120, padX = 22, padY = 18;\n        const x = i => count === 1 ? width / 2 : padX + i * ((width - padX * 2) / (count - 1));\n        const y = v => padY + (hi - v) / span * (height - padY * 2);\n        const points = key => days.map((d, i) => `${x(i)},${y(d[key])}`).join(" ");\n        chart.innerHTML = `\n            <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" class="w-full h-full" role="img" aria-label="Évolution des températures sur 7 jours">\n                <polyline points="${points("max")}" fill="none" stroke="#fb923c" stroke-width="3" vector-effect="non-scaling-stroke"/>\n                <polyline points="${points("min")}" fill="none" stroke="#38bdf8" stroke-width="3" vector-effect="non-scaling-stroke"/>\n                ${days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.max)}" r="4" fill="#fb923c"/><circle cx="${x(i)}" cy="${y(d.min)}" r="4" fill="#38bdf8"/>`).join("")}\n            </svg>\n            <div class="absolute top-0 left-0 text-[11px] text-orange-300">Max</div>\n            <div class="absolute bottom-0 left-0 text-[11px] text-sky-300">Min</div>`;\n        card.classList.remove("hidden");\n    }\n\n'''
          if anchor not in s: raise SystemExit('showSuggestions anchor not found')
          s = s.replace(anchor, fn + anchor, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if 'orageradar-v13' not in t: raise SystemExit('expected cache v13 not found')
          sw.write_text(t.replace('orageradar-v13', 'orageradar-v14', 1), encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/orageradar-inline.js').write_text('\\n'.join(x for x in scripts if x.strip()), encoding='utf-8')
          PY
          node --check /tmp/orageradar-inline.js
          git diff --check

      - name: Commit forecast cycle
        shell: bash
        run: |
          git config user.name "OrageRadar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "feat: add 7-day forecast dashboard"
          git push origin HEAD:agent/7-day-forecast
