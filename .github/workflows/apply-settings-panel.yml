name: Apply settings panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-settings-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-panel
          fetch-depth: 0

      - name: Patch settings panel
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <button onclick="getCurrentLocation()"\n                class="w-full md:w-auto shrink-0 px-4 py-2.5 bg-slate-800 rounded-2xl text-sm border border-slate-700 flex items-center justify-center gap-x-2 hover:bg-slate-700">\n            <i class="fa-solid fa-location-dot text-sky-400"></i>\n            <span>Ma position</span>\n        </button>\n'''
          new = old + '''\n        <button onclick="openSettings()"\n                class="w-full md:w-auto shrink-0 px-4 py-2.5 bg-slate-800 rounded-2xl text-sm border border-slate-700 flex items-center justify-center gap-x-2 hover:bg-slate-700">\n            <i class="fa-solid fa-gear text-slate-300"></i>\n            <span>Réglages</span>\n        </button>\n'''
          if old not in s: raise SystemExit('header location button anchor not found')
          s = s.replace(old, new, 1)

          modal = '''\n<div id="settings-modal" class="hidden fixed inset-0 z-[2000] bg-slate-950/75 backdrop-blur-sm p-4" onclick="closeSettingsFromBackdrop(event)">\n    <div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl p-5" onclick="event.stopPropagation()">\n        <div class="flex items-center justify-between mb-5">\n            <h2 class="text-lg font-semibold flex items-center gap-2"><i class="fa-solid fa-gear text-sky-400"></i> Réglages</h2>\n            <button onclick="closeSettings()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>\n        </div>\n\n        <div class="space-y-5">\n            <div>\n                <label for="setting-startup" class="block text-sm font-medium mb-2">Lieu au démarrage</label>\n                <select id="setting-startup" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">\n                    <option value="last">Dernier lieu consulté</option>\n                    <option value="position">Ma position</option>\n                    <option value="paris">Paris</option>\n                </select>\n            </div>\n\n            <div>\n                <div class="flex items-center justify-between mb-2">\n                    <label for="setting-opacity" class="text-sm font-medium">Opacité du radar</label>\n                    <span id="setting-opacity-value" class="text-xs text-slate-400"></span>\n                </div>\n                <input id="setting-opacity" type="range" min="40" max="100" step="5" class="w-full" oninput="updateSettingsLabels()">\n            </div>\n\n            <div>\n                <div class="flex items-center justify-between mb-2">\n                    <label for="setting-speed" class="text-sm font-medium">Vitesse d'animation</label>\n                    <span id="setting-speed-value" class="text-xs text-slate-400"></span>\n                </div>\n                <input id="setting-speed" type="range" min="500" max="1600" step="100" class="w-full" oninput="updateSettingsLabels()">\n            </div>\n\n            <label class="flex items-center justify-between gap-4 bg-slate-800/60 border border-slate-700 rounded-2xl px-4 py-3">\n                <div>\n                    <div class="text-sm font-medium">Actualisation automatique</div>\n                    <div class="text-xs text-slate-400">Recharge les images radar toutes les 5 minutes</div>\n                </div>\n                <input id="setting-auto-refresh" type="checkbox" class="w-5 h-5 accent-sky-500">\n            </label>\n        </div>\n\n        <div class="flex gap-3 mt-6">\n            <button onclick="closeSettings()" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm">Annuler</button>\n            <button onclick="saveSettingsFromUI()" class="flex-1 px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium">Enregistrer</button>\n        </div>\n    </div>\n</div>\n'''
          marker = '\n</div>\n\n<script>'
          pos = s.rfind(marker)
          if pos < 0: raise SystemExit('outer app closing marker not found')
          s = s[:pos+len('\n</div>')] + modal + s[pos+len('\n</div>'):]

          old = '''    const LAST_LOCATION_KEY = "lastLocation";\n'''
          new = '''    const LAST_LOCATION_KEY = "lastLocation";\n    const SETTINGS_KEY = "orageradarSettings";\n    const DEFAULT_SETTINGS = { startup: "last", radarOpacity: 0.8, radarSpeed: 900, autoRefresh: true };\n\n    function loadSettings() {\n        try {\n            const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");\n            return { ...DEFAULT_SETTINGS, ...saved };\n        } catch (e) {\n            return { ...DEFAULT_SETTINGS };\n        }\n    }\n\n    let appSettings = loadSettings();\n    let radarRefreshTimer = null;\n\n    function openSettings() {\n        document.getElementById("setting-startup").value = appSettings.startup;\n        document.getElementById("setting-opacity").value = Math.round(appSettings.radarOpacity * 100);\n        document.getElementById("setting-speed").value = appSettings.radarSpeed;\n        document.getElementById("setting-auto-refresh").checked = !!appSettings.autoRefresh;\n        updateSettingsLabels();\n        document.getElementById("settings-modal").classList.remove("hidden");\n    }\n\n    function closeSettings() {\n        document.getElementById("settings-modal").classList.add("hidden");\n    }\n\n    function closeSettingsFromBackdrop(event) {\n        if (event.target.id === "settings-modal") closeSettings();\n    }\n\n    function updateSettingsLabels() {\n        const opacity = Number(document.getElementById("setting-opacity").value || 80);\n        const speed = Number(document.getElementById("setting-speed").value || 900);\n        document.getElementById("setting-opacity-value").textContent = `${opacity}%`;\n        document.getElementById("setting-speed-value").textContent = speed <= 700 ? "Rapide" : speed >= 1300 ? "Lente" : "Normale";\n    }\n\n    function saveSettingsFromUI() {\n        appSettings = {\n            startup: document.getElementById("setting-startup").value,\n            radarOpacity: Number(document.getElementById("setting-opacity").value) / 100,\n            radarSpeed: Number(document.getElementById("setting-speed").value),\n            autoRefresh: document.getElementById("setting-auto-refresh").checked\n        };\n        localStorage.setItem(SETTINGS_KEY, JSON.stringify(appSettings));\n        radarLayers.forEach((layer, index) => layer.setOpacity(index === radarFrameIndex ? appSettings.radarOpacity : 0));\n        if (radarAnimTimer) startRadarAnimation();\n        scheduleRadarRefresh();\n        closeSettings();\n    }\n\n    function scheduleRadarRefresh() {\n        if (radarRefreshTimer) { clearInterval(radarRefreshTimer); radarRefreshTimer = null; }\n        if (!appSettings.autoRefresh) return;\n        radarRefreshTimer = setInterval(() => {\n            if (currentMode === "radar" && radarMap) {\n                radarFramesLoadedAt = 0;\n                loadRadarFrames();\n            }\n        }, 5 * 60 * 1000);\n    }\n'''
          if old not in s: raise SystemExit('settings JS anchor not found')
          s = s.replace(old, new, 1)

          if '        cur.setOpacity(0.8);' not in s: raise SystemExit('radar opacity anchor not found')
          s = s.replace('        cur.setOpacity(0.8);', '        cur.setOpacity(appSettings.radarOpacity);', 1)

          if '        }, 900);' not in s: raise SystemExit('radar speed anchor not found')
          s = s.replace('        }, 900);', '        }, appSettings.radarSpeed);', 1)

          old_init = '''        const savedLocation = getLastLocation();\n        const startLocation = savedLocation || { ...DEFAULT_LOCATION, zoom: DEFAULT_ZOOM };\n\n        await setLocation(startLocation.lat, startLocation.lon, startLocation.name, startLocation.country || "", {\n            save: false,\n            zoom: startLocation.zoom,\n            showCountry: true\n        });\n'''
          new_init = '''        const savedLocation = getLastLocation();\n        const startLocation = appSettings.startup === "paris"\n            ? { ...DEFAULT_LOCATION, zoom: DEFAULT_ZOOM }\n            : (savedLocation || { ...DEFAULT_LOCATION, zoom: DEFAULT_ZOOM });\n\n        await setLocation(startLocation.lat, startLocation.lon, startLocation.name, startLocation.country || "", {\n            save: false,\n            zoom: startLocation.zoom,\n            showCountry: true\n        });\n\n        scheduleRadarRefresh();\n        if (appSettings.startup === "position") setTimeout(() => getCurrentLocation(), 250);\n'''
          if old_init not in s: raise SystemExit('init anchor not found')
          s = s.replace(old_init, new_init, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if 'orageradar-v12' not in t: raise SystemExit('expected cache v12 not found')
          sw.write_text(t.replace('orageradar-v12', 'orageradar-v13', 1), encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/orageradar-inline.js').write_text('\n'.join(x for x in scripts if x.strip()), encoding='utf-8')
          PY
          node --check /tmp/orageradar-inline.js
          git diff --check

      - name: Commit settings panel
        shell: bash
        run: |
          git config user.name "OrageRadar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "feat: add persistent settings panel"
          git push origin HEAD:agent/settings-panel
