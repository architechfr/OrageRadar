    <meta name="description" content="OrageRadar - Surveillance météo et radar orageux en temps réel.">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .suggestion-item:hover { background-color: #334155; }
        iframe { display: block; }
        .map-mode.active {
            background-color: #0284c7;
            border-color: #38bdf8;
            color: white;
        }
        .favorite-card:hover { background-color: #1e293b; }
        .app-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            display: block;
        }
        /* Empêche le zoom automatique d'iOS au focus (déclenché sous 16px),
           qui rendait la saisie d'adresse inutilisable sur téléphone. */
        @media (max-width: 640px) {
            #search-input { font-size: 16px; }
        }
        /* Bandeau d'alerte orage / instabilité */
        .alert-storm { background: rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.40); color:#fcd34d; }
        .alert-clear { background: rgba(52,211,153,.10); border:1px solid rgba(52,211,153,.35); color:#6ee7b7; }
        /* Carte radar autonome (Leaflet + RainViewer) — pas de point bleu parasite */
        #radar-map { height: 650px; width: 100%; background: #0b1120; }
        #radar-map .leaflet-container { background: #0b1120; }
        #radar-timestamp {
            position: absolute; bottom: 14px; left: 14px; z-index: 600;
            background: rgba(15,23,42,.88); border: 1px solid #334155;
            border-radius: 12px; padding: 6px 12px; font-size: 12px;
        }
        @media (max-width: 640px) {
            #radar-map, #windy { height: 480px; }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-200">

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-8">

            <div class="flex items-end gap-x-2 my-5">

            <button onclick="addCurrentToFavorites()"

    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-4">

            <div class="flex flex-wrap gap-2">
                <button id="mode-radar" onclick="setMapMode('radar')"
                        class="map-mode active px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-cloud-bolt mr-1"></i>

                <button id="mode-rain" onclick="setMapMode('rain')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-cloud-rain mr-1"></i>
                    Pluie +1h
                </button>

                <button id="mode-thunder" onclick="setMapMode('thunder')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-bolt mr-1"></i>
                    Orages +1h

                <button id="mode-clouds" onclick="setMapMode('clouds')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">

                    Nuages

                    class="hidden"

<script>
    const DEFAULT_LOCATION = {
        name: "Paris",
        country: "France",
        lat: 48.8566,
        lon: 2.3522
    };

    const DEFAULT_ZOOM = 8;
    const SELECTED_CITY_ZOOM = 12;
    const CURRENT_POSITION_ZOOM = 13;

    let currentLat = DEFAULT_LOCATION.lat;
    let currentLon = DEFAULT_LOCATION.lon;
    let currentCity = DEFAULT_LOCATION.name;
    let currentCountry = DEFAULT_LOCATION.country;
    let currentZoom = DEFAULT_ZOOM;
    let currentMode = "radar";

    const searchInput = document.getElementById("search-input");
    const suggestionsBox = document.getElementById("suggestions-box");

    searchInput.addEventListener("input", debounce(showSuggestions, 250));

    searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            searchCity();
        }
    });

    document.addEventListener("click", function (event) {
        if (!suggestionsBox.contains(event.target) && event.target !== searchInput) {
            suggestionsBox.classList.add("hidden");
        }
    });

    function debounce(callback, delay) {
        let timer;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => callback.apply(this, args), delay);
        };
    }

    function normalizeCityText(text) {
        return String(text || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[-_'’`]/g, " ")
            .replace(/[^\p{L}\p{N}\s]/gu, " ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function levenshtein(a, b) {
        a = normalizeCityText(a);
        b = normalizeCityText(b);

        const matrix = [];

        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                matrix[i][j] = b.charAt(i - 1) === a.charAt(j - 1)
                    ? matrix[i - 1][j - 1]
                    : Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
            }
        }

        return matrix[b.length][a.length];
    }

    function cityScore(query, place) {
        const q = normalizeCityText(query);
        const name = normalizeCityText(place.name || "");
        const full = normalizeCityText(`${place.name || ""} ${place.admin1 || ""} ${place.country || ""}`);

        if (!q || !name) return 0;
        if (name === q) return 100;
        if (full.includes(q)) return 94;
        if (name.includes(q)) return 90;
        if (q.includes(name)) return 82;

        const qWords = q.split(" ");
        const fullWords = full.split(" ");

        let wordMatches = 0;

        qWords.forEach(qWord => {
            if (fullWords.some(fullWord =>
                fullWord === qWord ||
                fullWord.includes(qWord) ||
                qWord.includes(fullWord) ||
                levenshtein(qWord, fullWord) <= 1
            )) {
                wordMatches++;
            }
        });

        const wordScore = Math.round((wordMatches / qWords.length) * 80);
        const distance = levenshtein(q, name);
        const maxLength = Math.max(q.length, name.length);
        const similarity = 1 - distance / maxLength;
        const typoScore = Math.round(similarity * 75);

        return Math.max(wordScore, typoScore);
    }

    function buildSearchVariants(query) {
        const normalized = normalizeCityText(query);

        const variants = [
            query,
            normalized,
            normalized.replace(/\s+/g, "-"),
            query.replace(/-/g, " "),
            query.replace(/\s+/g, "-")
        ];

        const words = normalized.split(" ").filter(Boolean);

        if (words.length > 1) {
            variants.push(words.join(" "));
            variants.push(words.join("-"));
            variants.push(words[0]);
            variants.push(words.slice(0, 2).join(" "));
        }

        return [...new Set(variants.filter(Boolean))];
    }

    async function fetchCitySuggestions(query) {
        const variants = buildSearchVariants(query);
        const allResults = [];

        for (const variant of variants) {
            const url =
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(variant)}` +
                "&count=10" +
                "&language=fr" +
                "&format=json";

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.results) {
                    allResults.push(...data.results);
                }
            } catch (error) {
                console.error(error);
            }
        }

        const deduped = [];

        allResults.forEach(place => {
            const key = `${place.name}-${place.admin1 || ""}-${place.country || ""}-${place.latitude}-${place.longitude}`;

            if (!deduped.some(item => {
                const itemKey = `${item.name}-${item.admin1 || ""}-${item.country || ""}-${item.latitude}-${item.longitude}`;
                return itemKey === key;
            })) {
                deduped.push(place);
            }
        });

        return deduped
            .map(place => ({ ...place, score: cityScore(query, place) }))
            .filter(place => place.score >= 30)
            .sort((a, b) => {
                if ((a.country || "") === "France" && (b.country || "") !== "France") return -1;
                if ((a.country || "") !== "France" && (b.country || "") === "France") return 1;
                return b.score - a.score;
            })
            .slice(0, 8);
    }

    function getWeatherInfo(code) {
        const map = {
            0: { emoji: "☀️", desc: "Dégagé" },
            1: { emoji: "🌤️", desc: "Peu nuageux" },
            2: { emoji: "⛅", desc: "Partiellement nuageux" },
            3: { emoji: "☁️", desc: "Couvert" },
            45: { emoji: "🌫️", desc: "Brouillard" },
            48: { emoji: "🌫️", desc: "Brouillard givrant" },
            51: { emoji: "🌦️", desc: "Bruine faible" },
            53: { emoji: "🌦️", desc: "Bruine modérée" },
            55: { emoji: "🌧️", desc: "Bruine dense" },
            61: { emoji: "🌧️", desc: "Pluie faible" },
            63: { emoji: "🌧️", desc: "Pluie modérée" },
            65: { emoji: "🌧️", desc: "Forte pluie" },
            71: { emoji: "🌨️", desc: "Neige faible" },
            73: { emoji: "🌨️", desc: "Neige modérée" },
            75: { emoji: "🌨️", desc: "Forte neige" },
            80: { emoji: "🌦️", desc: "Averses faibles" },
            81: { emoji: "🌧️", desc: "Averses modérées" },
            82: { emoji: "⛈️", desc: "Fortes averses" },
            95: { emoji: "⛈️", desc: "Orage" },
            96: { emoji: "⛈️", desc: "Orage avec grêle" },
            99: { emoji: "⛈️", desc: "Orage violent" }
        };

        return map[code] || { emoji: "🌤️", desc: "Variable" };
    }

    function getModeConfig(mode) {
        const configs = {
            radar: { overlay: "radar", calendar: "now", product: "", radarRange: "-1", label: "radar animé en direct" },
            rain: { overlay: "rain", calendar: "1", product: "ecmwf", radarRange: "", label: "pluie prévue +1h" },
            thunder: { overlay: "thunder", calendar: "1", product: "ecmwf", radarRange: "", label: "orages prévus +1h" },
            clouds: { overlay: "clouds", calendar: "now", product: "ecmwf", radarRange: "", label: "nuages" },
            wind: { overlay: "wind", calendar: "now", product: "ecmwf", radarRange: "", label: "vent" }
        };

        return configs[mode] || configs.radar;
    }

    // ── Carte radar autonome (Leaflet + RainViewer) ─────────────────────────
    // Remplace l'iframe Windy pour le mode « Radar animé » : marqueur maîtrisé
    // sur le lieu choisi, aucun point bleu de géolocalisation parasite.
    let radarMap = null, radarMarker = null, radarHost = "";
    let radarFrames = [], radarLayers = [], radarAnimTimer = null, radarFrameIndex = 0;
    let radarFramesLoadedAt = 0, radarLoading = false;

    function updateRadarMap(lat, lon, cityName, zoom) {
        if (!radarMap) {
            radarMap = L.map("radar-map").setView([lat, lon], zoom);
            L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
                attribution: "© OpenStreetMap © CARTO · Radar © RainViewer",
                subdomains: "abcd",
                maxZoom: 19
            }).addTo(radarMap);
            radarMarker = L.circleMarker([lat, lon], {
                radius: 8, color: "#fff", weight: 2.5,
                fillColor: "#38bdf8", fillOpacity: 1
            }).addTo(radarMap);
        } else {
            radarMap.setView([lat, lon], zoom);
            radarMarker.setLatLng([lat, lon]);
        }
        if (cityName) radarMarker.bindTooltip(cityName, { direction: "top", offset: [0, -8] });
        loadRadarFrames();
    }

    async function loadRadarFrames() {
        // Les images RainViewer se renouvellent toutes les ~10 min :
        // inutile de re-télécharger la liste à chaque déplacement de carte.
        if (radarLoading) return;
        if (radarLayers.length && Date.now() - radarFramesLoadedAt < 5 * 60 * 1000) {
            if (!radarAnimTimer) startRadarAnimation();
            return;
        }
        radarLoading = true;
        stopRadarAnimation();
        radarLayers.forEach(l => { if (radarMap.hasLayer(l)) radarMap.removeLayer(l); });
        radarLayers = []; radarFrames = [];
        try {
            const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
            const d = await r.json();
            radarHost = d.host;
            radarFrames = [...((d.radar && d.radar.past) || []).slice(-7), ...((d.radar && d.radar.nowcast) || [])];
            // Couches créées mais PAS ajoutées à la carte : seule l'image active
            // est montée (sinon 7× les tuiles à chaque vue → 429 RainViewer).
            // maxNativeZoom 7 : RainViewer ne sert pas de tuiles au-delà
            // (filigrane « Zoom Level Not Supported ») — Leaflet agrandit
            // lui-même les tuiles z7 aux zooms ville.
            radarLayers = radarFrames.map(f =>
                L.tileLayer(`${radarHost}${f.path}/256/{z}/{x}/{y}/6/1_1.png`,
                    { opacity: 0, zIndex: 400, maxNativeZoom: 7, maxZoom: 19 })
            );
            radarFramesLoadedAt = Date.now();
            startRadarAnimation();
        } catch (e) {
            console.error("RainViewer indisponible :", e);
            const el = document.getElementById("radar-timestamp");
            el.textContent = "Radar momentanément indisponible";
            el.classList.remove("hidden");
        } finally {
            radarLoading = false;
        }
    }

    function showRadarFrame(nextIndex) {
        const prev = radarLayers[radarFrameIndex];
        radarFrameIndex = nextIndex;
        const cur = radarLayers[nextIndex];
        if (!cur) return;
        if (!radarMap.hasLayer(cur)) cur.addTo(radarMap);
        cur.setOpacity(0.7);
        if (prev && prev !== cur) {
            prev.setOpacity(0);
            // Démonter l'image précédente après la transition pour limiter
            // les requêtes de tuiles lors des déplacements de carte.
            setTimeout(() => {
                if (radarLayers[radarFrameIndex] !== prev && radarMap.hasLayer(prev)) radarMap.removeLayer(prev);
            }, 1000);
        }
        updateRadarTimestamp();
    }

    function startRadarAnimation() {
        if (!radarLayers.length) return;
        showRadarFrame(0);
        radarAnimTimer = setInterval(() => {
            showRadarFrame((radarFrameIndex + 1) % radarLayers.length);
        }, 800);
    }

    function stopRadarAnimation() {
        if (radarAnimTimer) { clearInterval(radarAnimTimer); radarAnimTimer = null; }
    }

    function updateRadarTimestamp() {
        const f = radarFrames[radarFrameIndex];
        if (!f) return;
        const el = document.getElementById("radar-timestamp");
        const t = new Date(f.time * 1000);
        const diffMin = Math.round((t.getTime() - Date.now()) / 60000);
        const rel = diffMin >= 0 ? `prévision +${diffMin} min` : `il y a ${-diffMin} min`;
        el.textContent = `Radar ${t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} — ${rel}`;
        el.classList.remove("hidden");
    }

    function showRadarMap(show) {
        document.getElementById("radar-map").classList.toggle("hidden", !show);
        document.getElementById("radar-timestamp").classList.toggle("hidden", !show || !radarFrames.length);
        document.getElementById("windy").classList.toggle("hidden", show);
        if (show && radarMap) setTimeout(() => radarMap.invalidateSize(), 60);
        if (!show) stopRadarAnimation();
        else if (radarLayers.length && !radarAnimTimer) startRadarAnimation();
    }

    // Aiguillage : radar → carte autonome ; autres modes → iframe Windy
    function refreshMap() {
        if (currentMode === "radar") {
            showRadarMap(true);
            updateRadarMap(currentLat, currentLon, currentCity, currentZoom);
            document.getElementById("map-location").textContent =
                currentCity ? `${currentCity}${currentCountry ? " — " + currentCountry : ""} — radar animé en direct` : "";
        } else {
            showRadarMap(false);
            updateWindy(currentLat, currentLon, currentCity, currentCountry, currentZoom);
        }
    }

    function setMapMode(mode) {
        currentMode = mode;

        document.querySelectorAll(".map-mode").forEach(button => {
            button.classList.remove("active");
        });

        const activeButton = document.getElementById("mode-" + mode);
        if (activeButton) activeButton.classList.add("active");

        refreshMap();
    }

    function updateWindy(lat, lon, cityName = "", country = "", zoom = SELECTED_CITY_ZOOM) {
        const iframe = document.getElementById("windy");
        const modeConfig = getModeConfig(currentMode);

        let windyUrl =
            "https://embed.windy.com/embed2.html" +
            `?lat=${encodeURIComponent(lat)}` +
            `&lon=${encodeURIComponent(lon)}` +
            // Le pin Windy se place sur detailLat/detailLon (marker=true seul ne suffit pas)
            `&detailLat=${encodeURIComponent(lat)}` +
            `&detailLon=${encodeURIComponent(lon)}` +
            `&zoom=${encodeURIComponent(zoom)}` +
            "&level=surface" +
            `&overlay=${encodeURIComponent(modeConfig.overlay)}` +
            "&menu=true" +
            "&message=true" +
            "&marker=true" +
            `&calendar=${encodeURIComponent(modeConfig.calendar)}` +
            "&pressure=false" +
            "&type=map" +
            "&location=coordinates" +
            "&detail=false" +
            "&metricWind=km/h" +
            "&metricTemp=°C";

        if (modeConfig.product) windyUrl += `&product=${encodeURIComponent(modeConfig.product)}`;
        if (modeConfig.radarRange) windyUrl += `&radarRange=${encodeURIComponent(modeConfig.radarRange)}`;

        iframe.src = windyUrl;

        document.getElementById("map-location").textContent =
            cityName ? `${cityName}${country ? " — " + country : ""} — ${modeConfig.label}` : "";
    }

    async function setLocation(lat, lon, cityName, country = "", options = {}) {
        const save = options.save ?? true;
        const zoom = options.zoom ?? SELECTED_CITY_ZOOM;
        const showCountry = options.showCountry ?? true;

        currentLat = lat;
        currentLon = lon;
        currentCity = cityName;
        currentCountry = country;
        currentZoom = zoom;

        refreshMap();
        await loadWeather(lat, lon, cityName, showCountry ? country : "");

        if (save) saveToHistory(cityName, country, lat, lon);

        suggestionsBox.classList.add("hidden");
        searchInput.value = "";
        renderFavorites();
    }

    function saveToHistory(cityName, country, lat, lon) {
        let history = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        history = history.filter(item => !(item.name === cityName && item.country === country));

        history.unshift({ name: cityName, country: country, lat: lat, lon: lon });
        history = history.slice(0, 8);

        localStorage.setItem("searchHistory", JSON.stringify(history));
    }

    function getFavorites() {
        return JSON.parse(localStorage.getItem("favoriteCities") || "[]");
    }

    function saveFavorites(favorites) {
        localStorage.setItem("favoriteCities", JSON.stringify(favorites));
    }

    function addCurrentToFavorites() {
        let favorites = getFavorites();

        const exists = favorites.some(item => item.name === currentCity && item.country === currentCountry);

        if (!exists) {
            favorites.unshift({
                name: currentCity,
                country: currentCountry,
                lat: currentLat,
                lon: currentLon
            });
        }

        favorites = favorites.slice(0, 12);
        saveFavorites(favorites);
        renderFavorites();
    }

    function removeFavorite(index) {
        const favorites = getFavorites();
        favorites.splice(index, 1);
        saveFavorites(favorites);
        renderFavorites();
    }

    function clearFavorites() {
        localStorage.removeItem("favoriteCities");
        renderFavorites();
    }

    function renderFavorites() {
        const container = document.getElementById("favorites-list");
        const favorites = getFavorites();

        container.innerHTML = "";

        if (favorites.length === 0) {
            container.innerHTML = `
                <div class="text-sm text-slate-400 bg-slate-800/60 rounded-2xl p-4">
                    Aucun favori pour le moment.
                </div>
            `;
            return;
        }

        favorites.forEach((item, index) => {
            const div = document.createElement("div");
            div.className =
                "favorite-card flex items-center justify-between gap-3 bg-slate-800/70 border border-slate-700 rounded-2xl px-3 py-2 cursor-pointer";

            div.innerHTML = `
                <div class="min-w-0">
                    <div class="font-medium text-sm truncate">${item.name}</div>
                    <div class="text-xs text-slate-400 truncate">${item.country || ""}</div>
                </div>
                <button class="text-slate-500 hover:text-red-300 shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            div.onclick = async () => {
                await setLocation(item.lat, item.lon, item.name, item.country || "", {
                    save: false,
                    zoom: SELECTED_CITY_ZOOM,
                    showCountry: true
                });
            };

            div.querySelector("button").onclick = event => {
                event.stopPropagation();
                removeFavorite(index);
            };

            container.appendChild(div);
        });
    }

    async function loadWeather(lat, lon, cityName, country = "") {
        if (lat === undefined || lon === undefined || lat === null || lon === null) return;

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m" +
            "&minutely_15=precipitation,weather_code" +
            "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_gusts_10m,cape" +
            "&timezone=auto";

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (!data.current) throw new Error("Aucune donnée météo reçue.");

            const current = data.current;
            const info = getWeatherInfo(current.weather_code);

            document.getElementById("city").textContent = cityName;
            document.getElementById("country").textContent = country;
            document.getElementById("weather-icon").textContent = info.emoji;
            document.getElementById("temp").textContent = Math.round(current.temperature_2m);
            document.getElementById("description").textContent = info.desc;
            document.getElementById("feels-like").textContent = Math.round(current.apparent_temperature) + "°C";
            document.getElementById("wind").textContent = Math.round(current.wind_speed_10m) + " km/h";
            document.getElementById("humidity").textContent = Math.round(current.relative_humidity_2m) + "%";

            document.getElementById("update-time").textContent =
                "Mis à jour à " +
                new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

            renderStormAlert(current, data);
            renderHourlyForecast(data);

        } catch (error) {
            alert("Impossible de charger la météo pour cette ville.");
        }
    }

    function stormLevel(code) {
        if ([82, 95, 96, 99].includes(code)) return 2;
        if ([61, 63, 65, 71, 73, 75, 80, 81].includes(code)) return 1;
        return 0;
    }

    // Alerte combinant plusieurs signaux : le weather_code seul rate les orages
    // convectifs (le radar les voit avant le modèle).
    //  1. Nowcast 0-90 min (minutely_15) → pluie / orage imminent
    //  2. Prévision 0-12h : codes orage, probabilité de pluie, rafales
    //  3. CAPE (instabilité) → potentiel orageux même si le code dit « beau »
    function renderStormAlert(current, data) {
        const el = document.getElementById("storm-alert");
        if (!el) return;
        const now = new Date();

        let nowcastPrecip = 0, nowcastStorm = false;
        if (data.minutely_15 && data.minutely_15.time) {
            const t = data.minutely_15.time,
                  p = data.minutely_15.precipitation || [],
                  wc = data.minutely_15.weather_code || [];
            let s = t.findIndex(x => new Date(x) >= now); if (s === -1) s = 0;
            for (let i = s; i < s + 6 && i < t.length; i++) {
                nowcastPrecip += (p[i] || 0);
                if (stormLevel(wc[i]) >= 2) nowcastStorm = true;
            }
        }

        let level = 0, maxProb = 0, maxCape = 0, soonStorm = false;
        let maxGust = (current.wind_gusts_10m ?? current.wind_speed_10m) || 0;
        if (data.hourly) {
            const H = data.hourly;
            let s = H.time.findIndex(x => new Date(x) >= now); if (s === -1) s = 0;
            for (let i = s; i < s + 12 && i < H.time.length; i++) {
                const st = stormLevel(H.weather_code[i]);
                if (st >= 2) soonStorm = true;
                level = Math.max(level, st);
                if (H.precipitation_probability) maxProb = Math.max(maxProb, H.precipitation_probability[i] || 0);
                if (H.wind_gusts_10m)            maxGust = Math.max(maxGust, H.wind_gusts_10m[i] || 0);
                if (H.cape)                      maxCape = Math.max(maxCape, H.cape[i] || 0);
            }
        }

        let msg = "", cls = "alert-storm";
        if (nowcastStorm) {
            msg = `<i class="fa-solid fa-bolt"></i> Orage imminent (moins d'1 h) — mettez-vous à l'abri.`;
        } else if (nowcastPrecip >= 0.5) {
            msg = `<i class="fa-solid fa-cloud-showers-heavy"></i> Pluie imminente (~${nowcastPrecip.toFixed(1)} mm dans l'heure).`;
        } else if (level >= 2 || soonStorm) {
            msg = `<i class="fa-solid fa-triangle-exclamation"></i> Risque d'orage dans les prochaines heures.`;
        } else if (maxGust >= 50) {
            msg = `<i class="fa-solid fa-wind"></i> Rafales jusqu'à ${Math.round(maxGust)} km/h.`;
        } else if (maxProb >= 60 || level >= 1) {
            msg = `<i class="fa-solid fa-cloud-rain"></i> Pluie probable (${Math.round(maxProb)} %).`;
        } else if (maxCape >= 1000) {
            msg = `<i class="fa-solid fa-cloud-bolt"></i> Atmosphère instable (potentiel orageux) — surveillez le radar, les cellules peuvent se former vite.`;
        } else {
            cls = "alert-clear";
            msg = `<i class="fa-solid fa-circle-check"></i> Pas d'alerte orage sur les prochaines heures.`;
        }
        el.className = "rounded-2xl px-4 py-3 text-sm mb-5 flex items-center gap-2 " + cls;
        el.innerHTML = msg;
        el.classList.remove("hidden");
    }

    function renderHourlyForecast(data) {
        const container = document.getElementById("hourly");
        container.innerHTML = "";

        const now = new Date();
        let startIndex = data.hourly.time.findIndex(time => new Date(time) >= now);

        if (startIndex === -1) startIndex = 0;

        for (let i = startIndex; i < startIndex + 8 && i < data.hourly.time.length; i++) {
            const hourDate = new Date(data.hourly.time[i]);
            const hourInfo = getWeatherInfo(data.hourly.weather_code[i]);

            const div = document.createElement("div");
            div.className = "bg-slate-800 border border-slate-700 rounded-2xl p-3 text-center";

            div.innerHTML = `
                <div class="text-xs text-slate-400">
                    ${hourDate.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}
                </div>
                <div class="text-2xl my-1">${hourInfo.emoji}</div>
                <div class="font-semibold">${Math.round(data.hourly.temperature_2m[i])}°</div>
            `;

            container.appendChild(div);
        }
    }

    async function showSuggestions() {
        const query = searchInput.value.trim();

        if (query.length < 2) {
            suggestionsBox.classList.add("hidden");
            suggestionsBox.innerHTML = "";
            return;
        }

        suggestionsBox.innerHTML = "";
        suggestionsBox.classList.remove("hidden");

        renderHistory();

        const results = await fetchCitySuggestions(query);

        if (results.length > 0) {
            const header = document.createElement("div");
            header.className = "px-4 py-1 text-xs text-slate-400 bg-slate-800";
            header.textContent = "Suggestions corrigées";
            suggestionsBox.appendChild(header);

            results.forEach(place => {
                const div = document.createElement("div");
                div.className = "suggestion-item px-4 py-2 cursor-pointer flex justify-between gap-3 text-sm";

                const admin = place.admin1 ? `, ${place.admin1}` : "";
                const country = place.country || "";

                div.innerHTML = `
                    <span>${place.name}${admin}</span>
                    <span class="text-xs text-slate-400">${country}</span>
                `;

                div.onclick = async () => {
                    await setLocation(place.latitude, place.longitude, place.name, country, {
                        save: true,
                        zoom: SELECTED_CITY_ZOOM,
                        showCountry: true
                    });
                };

                suggestionsBox.appendChild(div);
            });
        } else {
            const empty = document.createElement("div");
            empty.className = "px-4 py-3 text-sm text-slate-400";
            empty.textContent = "Aucune ville trouvée.";
            suggestionsBox.appendChild(empty);
        }
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        if (history.length === 0) return;

        const header = document.createElement("div");
        header.className = "px-4 py-1 text-xs text-slate-400 bg-slate-800";
        header.textContent = "Recherches récentes";
        suggestionsBox.appendChild(header);

        history.forEach(item => {
            const div = document.createElement("div");
            div.className = "suggestion-item px-4 py-2 cursor-pointer flex justify-between gap-3 text-sm";

            div.innerHTML = `
                <span>${item.name}</span>
                <span class="text-xs text-slate-400">${item.country || ""}</span>
            `;

            div.onclick = async () => {
                await setLocation(item.lat, item.lon, item.name, item.country || "", {
                    save: false,
                    zoom: SELECTED_CITY_ZOOM,
                    showCountry: true
                });
            };

            suggestionsBox.appendChild(div);
        });
    }

    async function searchCity() {
        const query = searchInput.value.trim();

        if (!query) return;

        const results = await fetchCitySuggestions(query);

        if (results.length > 0) {
            const place = results[0];

            await setLocation(place.latitude, place.longitude, place.name, place.country || "", {
                save: true,
                zoom: SELECTED_CITY_ZOOM,
                showCountry: true
            });
        } else {
            alert("Ville non trouvée.");
        }
    }

    // Nom de la commune à partir de coordonnées, pour vérifier visuellement
    // que la géolocalisation est correcte (BAN pour la France, fallback mondial).
    async function reverseGeocode(lat, lon) {
        try {
            const r = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lat=${lat}&lon=${lon}&type=municipality`);
            const d = await r.json();
            const f = d.features && d.features[0];
            if (f && f.properties && f.properties.city) return { name: f.properties.city, country: "France" };
        } catch (e) { /* hors France ou API indisponible */ }
        try {
            const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
            const d = await r.json();
            if (d.city || d.locality) return { name: d.city || d.locality, country: d.countryName || "" };
        } catch (e) { /* silencieux */ }
        return null;
    }

    function getCurrentLocation() {
        if (!navigator.geolocation) {
            alert("La géolocalisation n'est pas disponible sur ce navigateur.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = Math.round(position.coords.accuracy || 0);

                // Nommer le lieu détecté pour que l'utilisateur puisse contrôler
                const place = await reverseGeocode(lat, lon);
                const name = place ? place.name : "Ma position";
                const country = place ? place.country : "";

                await setLocation(lat, lon, name, country, {
                    save: false,
                    zoom: CURRENT_POSITION_ZOOM,
                    showCountry: !!country
                });

                // Position réseau/IP très imprécise (fréquent sur PC fixe) → prévenir
                if (accuracy > 5000) {
                    document.getElementById("update-time").textContent +=
                        ` — position approximative (±${Math.round(accuracy / 1000)} km), préférez la recherche par ville`;
                }
            },
            () => {
                alert("Impossible d'obtenir votre position. Recherchez votre ville par son nom.");
            },
            {
                enableHighAccuracy: true,
                timeout: 12000,
                maximumAge: 0
            }
        );
    }

    async function init() {
        currentMode = "radar";

        renderFavorites();

        await setLocation(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name, DEFAULT_LOCATION.country, {
            save: false,
            zoom: DEFAULT_ZOOM,
            showCountry: true
        });
    }

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js");
        });
    }

    window.onload = init;
</script>
