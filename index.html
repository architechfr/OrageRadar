    <meta name="theme-color" content="#020617">
    <meta name="application-name" content="OrageRadar">
    <meta name="apple-mobile-web-app-title" content="OrageRadar">

<body class="bg-slate-950 text-slate-200">

<div class="max-w-screen-xl mx-auto px-4 sm:px-6 py-6">

    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-6">

            <img src="logo.png" alt="OrageRadar" class="app-logo">

            <div>
                <h1 class="text-2xl font-semibold tracking-tight">OrageRadar</h1>
                <p class="text-xs text-lime-300 -mt-1">Anticipez les orages</p>
            </div>
        </div>

        <div class="w-full md:flex-1 md:max-w-md relative">
            <div class="relative">
                <input id="search-input"
                       type="text"
                       inputmode="search"
                       autocomplete="off"
                       placeholder="Rechercher une ville..."

                <i class="fa-solid fa-search absolute left-4 top-3 text-slate-500"></i>
            </div>

            <div id="suggestions-box"
                 class="absolute z-50 w-full mt-1 bg-slate-900 border border-slate-700 rounded-2xl shadow-xl hidden max-h-96 overflow-auto">
            </div>
        </div>

        <button onclick="getCurrentLocation()"
                class="w-full md:w-auto shrink-0 px-4 py-2.5 bg-slate-800 rounded-2xl text-sm border border-slate-700 flex items-center justify-center gap-x-2 hover:bg-slate-700">
            <i class="fa-solid fa-location-dot text-sky-400"></i>
            <span>Ma position</span>
        </button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-8">

        <div class="xl:col-span-4 bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-x-2">
                        <span id="city" class="text-2xl font-semibold">Paris</span>
                        <span id="country" class="text-slate-400">France</span>
                    </div>
                    <div id="update-time" class="text-sm text-slate-400"></div>
                </div>

                <div id="weather-icon" class="text-5xl"></div>
            </div>

            <div class="flex items-end gap-x-2 my-5">
                <div id="temp" class="text-7xl font-bold">--</div>
                <div class="text-3xl text-slate-400 pb-1">°C</div>
            </div>

            <div id="description" class="text-xl mb-5">Chargement...</div>

            <div class="grid grid-cols-3 gap-3 text-sm mb-4">
                <div class="bg-slate-800 rounded-2xl p-3">
                    <div class="text-slate-400 text-xs">Ressenti</div>
                    <div id="feels-like" class="font-semibold">--°C</div>
                </div>

                <div class="bg-slate-800 rounded-2xl p-3">
                    <div class="text-slate-400 text-xs">Vent</div>
                    <div id="wind" class="font-semibold">-- km/h</div>
                </div>

                <div class="bg-slate-800 rounded-2xl p-3">
                    <div class="text-slate-400 text-xs">Humidité</div>
                    <div id="humidity" class="font-semibold">--%</div>
                </div>
            </div>

            <button onclick="addCurrentToFavorites()"
                    class="w-full px-4 py-2.5 rounded-2xl bg-amber-500/15 border border-amber-400/40 text-amber-200 hover:bg-amber-500/25 text-sm">
                <i class="fa-solid fa-star mr-1"></i>
                Ajouter aux favoris
            </button>
        </div>

        <div class="xl:col-span-5 bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <h3 class="font-semibold mb-4 flex items-center gap-x-2">
                <i class="fa-solid fa-clock text-sky-400"></i>
                Prévisions horaires
            </h3>

            <div id="hourly" class="grid grid-cols-4 gap-3"></div>
        </div>

        <div class="xl:col-span-3 bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold flex items-center gap-x-2">
                    <i class="fa-solid fa-star text-amber-300"></i>
                    Favoris
                </h3>

                <button onclick="clearFavorites()"
                        class="text-xs text-slate-400 hover:text-red-300">
                    Effacer
                </button>
            </div>

            <div id="favorites-list" class="space-y-2"></div>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-4">
        <div class="flex flex-col gap-3 mb-4 px-2">

            <div class="flex justify-between items-center gap-4">
                <h2 class="font-semibold flex items-center gap-x-2">
                    <i class="fa-solid fa-satellite text-red-400"></i>
                    Radar & Carte
                </h2>

                <div id="map-location" class="text-xs text-slate-400 text-right"></div>
            </div>

            <div class="flex flex-wrap gap-2">
                <button id="mode-radar" onclick="setMapMode('radar')"
                        class="map-mode active px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-cloud-bolt mr-1"></i>
                    Radar animé
                </button>

                <button id="mode-rain" onclick="setMapMode('rain')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-cloud-rain mr-1"></i>
                    Pluie +1h
                </button>

                <button id="mode-thunder" onclick="setMapMode('thunder')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-bolt mr-1"></i>
                    Orages +1h
                </button>

                <button id="mode-clouds" onclick="setMapMode('clouds')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-cloud mr-1"></i>
                    Nuages
                </button>

                <button id="mode-wind" onclick="setMapMode('wind')"
                        class="map-mode px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm hover:bg-slate-700">
                    <i class="fa-solid fa-wind mr-1"></i>
                    Vent
                </button>
            </div>
        </div>

        <div class="rounded-2xl overflow-hidden border border-slate-700">
            <iframe id="windy"
                    width="100%"
                    height="650"
                    frameborder="0"
                    src="">
            </iframe>
        </div>
    </div>

</div>

<script>
    const DEFAULT_LOCATION = {
        name: "Paris",
        country: "France",
        lat: 48.8566,
        lon: 2.3522
    };

    const DEFAULT_ZOOM = 8;
    const SELECTED_CITY_ZOOM = 12;
    const CURRENT_POSITION_ZOOM = 13;

    let currentLat = DEFAULT_LOCATION.lat;
    let currentLon = DEFAULT_LOCATION.lon;
    let currentCity = DEFAULT_LOCATION.name;
    let currentCountry = DEFAULT_LOCATION.country;
    let currentZoom = DEFAULT_ZOOM;
    let currentMode = "radar";

    const searchInput = document.getElementById("search-input");
    const suggestionsBox = document.getElementById("suggestions-box");

    searchInput.addEventListener("input", debounce(showSuggestions, 250));

    searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            searchCity();
        }
    });

    document.addEventListener("click", function (event) {
        if (!suggestionsBox.contains(event.target) && event.target !== searchInput) {
            suggestionsBox.classList.add("hidden");
        }
    });

    function debounce(callback, delay) {
        let timer;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => callback.apply(this, args), delay);
        };
    }

    function normalizeCityText(text) {
        return String(text || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[-_'’`]/g, " ")
            .replace(/[^\p{L}\p{N}\s]/gu, " ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function levenshtein(a, b) {
        a = normalizeCityText(a);
        b = normalizeCityText(b);

        const matrix = [];

        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                matrix[i][j] = b.charAt(i - 1) === a.charAt(j - 1)
                    ? matrix[i - 1][j - 1]
                    : Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
            }
        }

        return matrix[b.length][a.length];
    }

    function cityScore(query, place) {
        const q = normalizeCityText(query);
        const name = normalizeCityText(place.name || "");
        const full = normalizeCityText(`${place.name || ""} ${place.admin1 || ""} ${place.country || ""}`);

        if (!q || !name) return 0;
        if (name === q) return 100;
        if (full.includes(q)) return 94;
        if (name.includes(q)) return 90;
        if (q.includes(name)) return 82;

        const qWords = q.split(" ");
        const fullWords = full.split(" ");

        let wordMatches = 0;

        qWords.forEach(qWord => {
            if (fullWords.some(fullWord =>
                fullWord === qWord ||
                fullWord.includes(qWord) ||
                qWord.includes(fullWord) ||
                levenshtein(qWord, fullWord) <= 1
            )) {
                wordMatches++;
            }
        });

        const wordScore = Math.round((wordMatches / qWords.length) * 80);
        const distance = levenshtein(q, name);
        const maxLength = Math.max(q.length, name.length);
        const similarity = 1 - distance / maxLength;
        const typoScore = Math.round(similarity * 75);

        return Math.max(wordScore, typoScore);
    }

    function buildSearchVariants(query) {
        const normalized = normalizeCityText(query);

        const variants = [
            query,
            normalized,
            normalized.replace(/\s+/g, "-"),
            query.replace(/-/g, " "),
            query.replace(/\s+/g, "-")
        ];

        const words = normalized.split(" ").filter(Boolean);

        if (words.length > 1) {
            variants.push(words.join(" "));
            variants.push(words.join("-"));
            variants.push(words[0]);
            variants.push(words.slice(0, 2).join(" "));
        }

        return [...new Set(variants.filter(Boolean))];
    }

    async function fetchCitySuggestions(query) {
        const variants = buildSearchVariants(query);
        const allResults = [];

        for (const variant of variants) {
            const url =
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(variant)}` +
                "&count=10" +
                "&language=fr" +
                "&format=json";

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.results) {
                    allResults.push(...data.results);
                }
            } catch (error) {
                console.error(error);
            }
        }

        const deduped = [];

        allResults.forEach(place => {
            const key = `${place.name}-${place.admin1 || ""}-${place.country || ""}-${place.latitude}-${place.longitude}`;

            if (!deduped.some(item => {
                const itemKey = `${item.name}-${item.admin1 || ""}-${item.country || ""}-${item.latitude}-${item.longitude}`;
                return itemKey === key;
            })) {
                deduped.push(place);
            }
        });

        return deduped
            .map(place => ({ ...place, score: cityScore(query, place) }))
            .filter(place => place.score >= 30)
            .sort((a, b) => {
                if ((a.country || "") === "France" && (b.country || "") !== "France") return -1;
                if ((a.country || "") !== "France" && (b.country || "") === "France") return 1;
                return b.score - a.score;
            })
            .slice(0, 8);
    }

    function getWeatherInfo(code) {
        const map = {
            0: { emoji: "☀️", desc: "Dégagé" },
            1: { emoji: "🌤️", desc: "Peu nuageux" },
            2: { emoji: "⛅", desc: "Partiellement nuageux" },
            3: { emoji: "☁️", desc: "Couvert" },
            45: { emoji: "🌫️", desc: "Brouillard" },
            48: { emoji: "🌫️", desc: "Brouillard givrant" },
            51: { emoji: "🌦️", desc: "Bruine faible" },
            53: { emoji: "🌦️", desc: "Bruine modérée" },
            55: { emoji: "🌧️", desc: "Bruine dense" },
            61: { emoji: "🌧️", desc: "Pluie faible" },
            63: { emoji: "🌧️", desc: "Pluie modérée" },
            65: { emoji: "🌧️", desc: "Forte pluie" },
            71: { emoji: "🌨️", desc: "Neige faible" },
            73: { emoji: "🌨️", desc: "Neige modérée" },
            75: { emoji: "🌨️", desc: "Forte neige" },
            80: { emoji: "🌦️", desc: "Averses faibles" },
            81: { emoji: "🌧️", desc: "Averses modérées" },
            82: { emoji: "⛈️", desc: "Fortes averses" },
            95: { emoji: "⛈️", desc: "Orage" },
            96: { emoji: "⛈️", desc: "Orage avec grêle" },
            99: { emoji: "⛈️", desc: "Orage violent" }
        };

        return map[code] || { emoji: "🌤️", desc: "Variable" };
    }

    function getModeConfig(mode) {
        const configs = {
            radar: { overlay: "radar", calendar: "now", product: "", radarRange: "-1", label: "radar animé en direct" },
            rain: { overlay: "rain", calendar: "1", product: "ecmwf", radarRange: "", label: "pluie prévue +1h" },
            thunder: { overlay: "thunder", calendar: "1", product: "ecmwf", radarRange: "", label: "orages prévus +1h" },
            clouds: { overlay: "clouds", calendar: "now", product: "ecmwf", radarRange: "", label: "nuages" },
            wind: { overlay: "wind", calendar: "now", product: "ecmwf", radarRange: "", label: "vent" }
        };

        return configs[mode] || configs.radar;
    }

    function setMapMode(mode) {
        currentMode = mode;

        document.querySelectorAll(".map-mode").forEach(button => {
            button.classList.remove("active");
        });

        const activeButton = document.getElementById("mode-" + mode);
        if (activeButton) activeButton.classList.add("active");

        updateWindy(currentLat, currentLon, currentCity, currentCountry, currentZoom);
    }

    function updateWindy(lat, lon, cityName = "", country = "", zoom = SELECTED_CITY_ZOOM) {
        const iframe = document.getElementById("windy");
        const modeConfig = getModeConfig(currentMode);

        let windyUrl =
            "https://embed.windy.com/embed2.html" +
            `?lat=${encodeURIComponent(lat)}` +
            `&lon=${encodeURIComponent(lon)}` +
            `&zoom=${encodeURIComponent(zoom)}` +
            "&level=surface" +
            `&overlay=${encodeURIComponent(modeConfig.overlay)}` +
            "&menu=true" +
            "&message=true" +
            "&marker=true" +
            `&calendar=${encodeURIComponent(modeConfig.calendar)}` +
            "&pressure=false" +
            "&type=map" +
            "&location=coordinates" +
            "&detail=false" +
            "&metricWind=km/h" +
            "&metricTemp=°C";

        if (modeConfig.product) windyUrl += `&product=${encodeURIComponent(modeConfig.product)}`;
        if (modeConfig.radarRange) windyUrl += `&radarRange=${encodeURIComponent(modeConfig.radarRange)}`;

        iframe.src = windyUrl;

        document.getElementById("map-location").textContent =
            cityName ? `${cityName}${country ? " — " + country : ""} — ${modeConfig.label}` : "";
    }

    async function setLocation(lat, lon, cityName, country = "", options = {}) {
        const save = options.save ?? true;
        const zoom = options.zoom ?? SELECTED_CITY_ZOOM;
        const showCountry = options.showCountry ?? true;

        currentLat = lat;
        currentLon = lon;
        currentCity = cityName;
        currentCountry = country;
        currentZoom = zoom;

        updateWindy(lat, lon, cityName, country, zoom);
        await loadWeather(lat, lon, cityName, showCountry ? country : "");

        if (save) saveToHistory(cityName, country, lat, lon);

        suggestionsBox.classList.add("hidden");
        searchInput.value = "";
        renderFavorites();
    }

    function saveToHistory(cityName, country, lat, lon) {
        let history = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        history = history.filter(item => !(item.name === cityName && item.country === country));

        history.unshift({ name: cityName, country: country, lat: lat, lon: lon });
        history = history.slice(0, 8);

        localStorage.setItem("searchHistory", JSON.stringify(history));
    }

    function getFavorites() {
        return JSON.parse(localStorage.getItem("favoriteCities") || "[]");
    }

    function saveFavorites(favorites) {
        localStorage.setItem("favoriteCities", JSON.stringify(favorites));
    }

    function addCurrentToFavorites() {
        let favorites = getFavorites();

        const exists = favorites.some(item => item.name === currentCity && item.country === currentCountry);

        if (!exists) {
            favorites.unshift({
                name: currentCity,
                country: currentCountry,
                lat: currentLat,
                lon: currentLon
            });
        }

        favorites = favorites.slice(0, 12);
        saveFavorites(favorites);
        renderFavorites();
    }

    function removeFavorite(index) {
        const favorites = getFavorites();
        favorites.splice(index, 1);
        saveFavorites(favorites);
        renderFavorites();
    }

    function clearFavorites() {
        localStorage.removeItem("favoriteCities");
        renderFavorites();
    }

    function renderFavorites() {
        const container = document.getElementById("favorites-list");
        const favorites = getFavorites();

        container.innerHTML = "";

        if (favorites.length === 0) {
            container.innerHTML = `
                <div class="text-sm text-slate-400 bg-slate-800/60 rounded-2xl p-4">
                    Aucun favori pour le moment.
                </div>
            `;
            return;
        }

        favorites.forEach((item, index) => {
            const div = document.createElement("div");
            div.className =
                "favorite-card flex items-center justify-between gap-3 bg-slate-800/70 border border-slate-700 rounded-2xl px-3 py-2 cursor-pointer";

            div.innerHTML = `
                <div class="min-w-0">
                    <div class="font-medium text-sm truncate">${item.name}</div>
                    <div class="text-xs text-slate-400 truncate">${item.country || ""}</div>
                </div>
                <button class="text-slate-500 hover:text-red-300 shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            div.onclick = async () => {
                await setLocation(item.lat, item.lon, item.name, item.country || "", {
                    save: false,
                    zoom: SELECTED_CITY_ZOOM,
                    showCountry: true
                });
            };

            div.querySelector("button").onclick = event => {
                event.stopPropagation();
                removeFavorite(index);
            };

            container.appendChild(div);
        });
    }

    async function loadWeather(lat, lon, cityName, country = "") {
        if (lat === undefined || lon === undefined || lat === null || lon === null) return;

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
            "&hourly=temperature_2m,weather_code" +
            "&timezone=auto";

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (!data.current) throw new Error("Aucune donnée météo reçue.");

            const current = data.current;
            const info = getWeatherInfo(current.weather_code);

            document.getElementById("city").textContent = cityName;
            document.getElementById("country").textContent = country;
            document.getElementById("weather-icon").textContent = info.emoji;
            document.getElementById("temp").textContent = Math.round(current.temperature_2m);
            document.getElementById("description").textContent = info.desc;
            document.getElementById("feels-like").textContent = Math.round(current.apparent_temperature) + "°C";
            document.getElementById("wind").textContent = Math.round(current.wind_speed_10m) + " km/h";
            document.getElementById("humidity").textContent = Math.round(current.relative_humidity_2m) + "%";

            document.getElementById("update-time").textContent =
                "Mis à jour à " +
                new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

            renderHourlyForecast(data);

        } catch (error) {
            alert("Impossible de charger la météo pour cette ville.");
        }
    }

    function renderHourlyForecast(data) {
        const container = document.getElementById("hourly");
        container.innerHTML = "";

        const now = new Date();
        let startIndex = data.hourly.time.findIndex(time => new Date(time) >= now);

        if (startIndex === -1) startIndex = 0;

        for (let i = startIndex; i < startIndex + 8 && i < data.hourly.time.length; i++) {
            const hourDate = new Date(data.hourly.time[i]);
            const hourInfo = getWeatherInfo(data.hourly.weather_code[i]);

            const div = document.createElement("div");
            div.className = "bg-slate-800 border border-slate-700 rounded-2xl p-3 text-center";

            div.innerHTML = `
                <div class="text-xs text-slate-400">
                    ${hourDate.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}
                </div>
                <div class="text-2xl my-1">${hourInfo.emoji}</div>
                <div class="font-semibold">${Math.round(data.hourly.temperature_2m[i])}°</div>
            `;

            container.appendChild(div);
        }
    }

    async function showSuggestions() {
        const query = searchInput.value.trim();

        if (query.length < 2) {
            suggestionsBox.classList.add("hidden");
            suggestionsBox.innerHTML = "";
            return;
        }

        suggestionsBox.innerHTML = "";
        suggestionsBox.classList.remove("hidden");

        renderHistory();

        const results = await fetchCitySuggestions(query);

        if (results.length > 0) {
            const header = document.createElement("div");
            header.className = "px-4 py-1 text-xs text-slate-400 bg-slate-800";
            header.textContent = "Suggestions corrigées";
            suggestionsBox.appendChild(header);

            results.forEach(place => {
                const div = document.createElement("div");
                div.className = "suggestion-item px-4 py-2 cursor-pointer flex justify-between gap-3 text-sm";

                const admin = place.admin1 ? `, ${place.admin1}` : "";
                const country = place.country || "";

                div.innerHTML = `
                    <span>${place.name}${admin}</span>
                    <span class="text-xs text-slate-400">${country}</span>
                `;

                div.onclick = async () => {
                    await setLocation(place.latitude, place.longitude, place.name, country, {
                        save: true,
                        zoom: SELECTED_CITY_ZOOM,
                        showCountry: true
                    });
                };

                suggestionsBox.appendChild(div);
            });
        } else {
            const empty = document.createElement("div");
            empty.className = "px-4 py-3 text-sm text-slate-400";
            empty.textContent = "Aucune ville trouvée.";
            suggestionsBox.appendChild(empty);
        }
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        if (history.length === 0) return;

        const header = document.createElement("div");
        header.className = "px-4 py-1 text-xs text-slate-400 bg-slate-800";
        header.textContent = "Recherches récentes";
        suggestionsBox.appendChild(header);

        history.forEach(item => {
            const div = document.createElement("div");
            div.className = "suggestion-item px-4 py-2 cursor-pointer flex justify-between gap-3 text-sm";

            div.innerHTML = `
                <span>${item.name}</span>
                <span class="text-xs text-slate-400">${item.country || ""}</span>
            `;

            div.onclick = async () => {
                await setLocation(item.lat, item.lon, item.name, item.country || "", {
                    save: false,
                    zoom: SELECTED_CITY_ZOOM,
                    showCountry: true
                });
            };

            suggestionsBox.appendChild(div);
        });
    }

    async function searchCity() {
        const query = searchInput.value.trim();

        if (!query) return;

        const results = await fetchCitySuggestions(query);

        if (results.length > 0) {
            const place = results[0];

            await setLocation(place.latitude, place.longitude, place.name, place.country || "", {
                save: true,
                zoom: SELECTED_CITY_ZOOM,
                showCountry: true
            });
        } else {
            alert("Ville non trouvée.");
        }
    }

    function getCurrentLocation() {
        if (!navigator.geolocation) {
            alert("La géolocalisation n'est pas disponible sur ce navigateur.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async position => {
                await setLocation(
                    position.coords.latitude,
                    position.coords.longitude,
                    "Ma position",
                    "",
                    {
                        save: false,
                        zoom: CURRENT_POSITION_ZOOM,
                        showCountry: false
                    }
                );
            },
            () => {
                alert("Impossible d'obtenir votre position.");
            },
            {
                enableHighAccuracy: true,
                timeout: 12000,
                maximumAge: 0
            }
        );
    }

    async function init() {
        currentMode = "radar";

        renderFavorites();

        await setLocation(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name, DEFAULT_LOCATION.country, {
            save: false,
            zoom: DEFAULT_ZOOM,
            showCountry: true
        });
    }

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js");
        });
    }

    window.onload = init;
</script>

</body>
</html>
